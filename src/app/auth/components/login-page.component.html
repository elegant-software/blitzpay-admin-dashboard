<div class="auth-page">
  <div class="auth-card card shadow-sm border-0">
    <div class="card-body p-4 p-lg-5">
      <div class="auth-logo-wrap">
        <span class="auth-logo-mark">Z</span>
        <span class="auth-logo-name">ZackPay</span>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Admin Dashboard</p>

      <div class="alert alert-danger mt-3" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="auth-actions mt-4">
        <button class="btn btn-primary btn-lg w-100" type="button" (click)="signIn()">Sign in</button>
        <button class="btn btn-outline-primary btn-lg w-100" type="button" (click)="register()">Create account</button>
      </div>
    </div>
  </div>
</div>
