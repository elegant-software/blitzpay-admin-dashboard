<div class="app-layout">
  <aside class="sidebar sidebar-dark sidebar-fixed border-end app-sidebar" id="sidebar" [class.sidebar-narrow]="sidebarCollapsed">
    <div class="sidebar-header border-bottom px-3 py-3 d-flex align-items-center">
      <div class="sidebar-brand-wrap">
        <div class="sidebar-brand-logo zackpay-brand-full">
          <span class="zackpay-wordmark">ZackPay</span>
          <span class="zackpay-sub">Admin Panel</span>
        </div>
      </div>
      <div class="sidebar-brand-mark">
        <span class="zackpay-mark">Z</span>
      </div>
    </div>

    <ul class="sidebar-nav">
      <li class="nav-title">Dashboard</li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 13h8V3H3v10zm10 8h8V11h-8v10zM3 21h8v-6H3v6zm10-10h8V3h-8v8z"/></svg>
          </span>
          Dashboard
        </a>
      </li>

      <li class="nav-title mt-2">Operations</li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/merchants" routerLinkActive="active">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 10H4v-2h11v2zm3-4H4V8h14v2z"/></svg>
          </span>
          Merchants
          <span class="badge bg-light text-dark ms-auto">LIVE</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/appointments" routerLinkActive="active">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM7 11h5v5H7z"/></svg>
          </span>
          Appointments
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/user-management" routerLinkActive="active">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
          </span>
          User Management
        </a>
      </li>

      <li class="nav-title mt-2">Finance</li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/settlements" routerLinkActive="active">
          <span class="nav-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H7v-2h5v2zm5-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
          </span>
          Settlements
        </a>
      </li>
    </ul>

    <div class="sidebar-footer border-top p-2 d-flex justify-content-end">
      <button class="sidebar-fold-toggle" type="button" aria-label="Collapse sidebar" (click)="toggleSidebar()">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
    </div>
  </aside>

  <div class="wrapper d-flex flex-column min-vh-100 app-main" [class.app-main-collapsed]="sidebarCollapsed">
    <header class="header header-sticky p-0 shadow-sm topbar-fixed">
      <div class="container-fluid px-4 py-2 d-flex justify-content-between align-items-center bg-white">
        <div class="d-flex align-items-center gap-3">
          <button class="header-toggle" type="button" aria-label="Toggle sidebar" (click)="toggleSidebar()">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6h16v2H4zm4 5h12v2H8zm-4 5h16v2H4z"/></svg>
          </button>
          <span class="topbar-brand">ZackPay Admin</span>
        </div>

        <div class="d-flex align-items-center gap-3 header-right-tools">
          <span class="auth-user-name" *ngIf="session$ | async as session">{{ session.displayName || session.email || 'Admin' }}</span>
          <button class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1" type="button" (click)="logout()">
            <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            Logout
          </button>
        </div>
      </div>
    </header>

    <div class="body flex-grow-1">
      <router-outlet></router-outlet>
    </div>

    <footer class="footer px-4 py-3 bg-white border-top d-flex justify-content-between align-items-center">
      <div>ZackPay Admin Panel</div>
      <div class="text-body-secondary small">Internal operations dashboard</div>
    </footer>
  </div>

</div>
