<div class="container-fluid px-4 pt-2 pb-4">
  <div class="d-flex align-items-center gap-2 mb-3">
    <a class="btn btn-link btn-sm ps-0" [routerLink]="['/merchants', merchantId]">← Back to merchant</a>
  </div>

  <div class="alert alert-danger mb-3" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div *ngIf="loading" class="text-center py-5 text-muted">Loading…</div>

  <ng-container *ngIf="!loading && branch">
    <div class="card mb-4">
      <div class="card-header">Edit Branch — {{ branch.name }}</div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label required">Branch Name</label>
            <input class="form-control" [(ngModel)]="form.name" />
          </div>
          <div class="col-md-3">
            <label class="form-label d-block">Active</label>
            <div class="form-check form-switch mt-2">
              <input class="form-check-input" type="checkbox" [(ngModel)]="form.active" />
              <label class="form-check-label">{{ form.active ? 'Active' : 'Inactive' }}</label>
            </div>
          </div>
          <div class="col-md-3">
            <label class="form-label">Website</label>
            <input class="form-control" [(ngModel)]="form.website" type="url" />
          </div>

          <div class="col-12"><hr class="my-0" /></div>
          <div class="col-md-4">
            <label class="form-label">Address Line 1</label>
            <input class="form-control" [(ngModel)]="form.addressLine1" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Address Line 2</label>
            <input class="form-control" [(ngModel)]="form.addressLine2" />
          </div>
          <div class="col-md-2">
            <label class="form-label">City</label>
            <input class="form-control" [(ngModel)]="form.city" />
          </div>
          <div class="col-md-2">
            <label class="form-label">Postal Code</label>
            <input class="form-control" [(ngModel)]="form.postalCode" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Country</label>
            <input class="form-control" [(ngModel)]="form.country" />
          </div>

          <div class="col-12"><hr class="my-0" /></div>
          <div class="col-md-4">
            <label class="form-label">Contact Name</label>
            <input class="form-control" [(ngModel)]="form.contactFullName" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Contact Email</label>
            <input class="form-control" [(ngModel)]="form.contactEmail" type="email" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Contact Phone</label>
            <input class="form-control" [(ngModel)]="form.contactPhoneNumber" type="tel" />
          </div>

          <div class="col-12"><hr class="my-0" /></div>
          <div class="col-md-3">
            <label class="form-label">Latitude</label>
            <input class="form-control" [(ngModel)]="form.latitude" type="number" step="any" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Longitude</label>
            <input class="form-control" [(ngModel)]="form.longitude" type="number" step="any" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Geofence Radius (m)</label>
            <input class="form-control" [(ngModel)]="form.geofenceRadiusMeters" type="number" />
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-primary" type="button" [disabled]="saving" (click)="save()">
        <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
        {{ saving ? 'Saving…' : 'Save changes' }}
      </button>
      <button class="btn btn-outline-secondary" type="button" (click)="cancel()">Cancel</button>
    </div>
  </ng-container>
</div>
