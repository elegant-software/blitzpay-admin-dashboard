apiVersion: apps/v1
kind: Deployment
metadata:
  name: blitzpay-admin-dashboard
  labels:
    app: blitzpay-admin-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blitzpay-admin-dashboard
  template:
    metadata:
      labels:
        app: blitzpay-admin-dashboard
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: blitzpay-admin-dashboard
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: blitzpay-admin-dashboard
spec:
  selector:
    app: blitzpay-admin-dashboard
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
