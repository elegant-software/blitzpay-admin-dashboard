<header class="storefront-header">
  <a class="brand" href="/" aria-label="BlitzPay home">
    <span class="brand-mark">B</span>
    <span>BlitzPay</span>
  </a>
  <span class="guest-label">Guest checkout</span>
</header>

<main class="storefront-content">
  <router-outlet />
  <aside class="install-prompt" data-testid="app-install-prompt" aria-label="Get the BlitzPay app">
    <div class="phone-preview" aria-hidden="true">
      <div class="phone-camera"></div>
      <div class="app-screen">
        <span class="app-screen-title">BlitzPay</span>
        <div class="app-card"></div>
        <div class="app-line wide"></div>
        <div class="app-line"></div>
        <div class="app-button">Pay securely</div>
      </div>
    </div>
    <div class="install-message">
      <p class="eyebrow">BlitzPay Mobile</p>
      <p class="install-title">Get the BlitzPay app</p>
      <p class="install-copy">Keep payments and order updates ready on your phone.</p>
      <div class="store-links">
        <a href="https://apps.apple.com/us/search?term=BlitzPay" target="_blank" rel="noopener noreferrer">App Store</a>
        <a href="https://play.google.com/store/search?q=BlitzPay&amp;c=apps" target="_blank" rel="noopener noreferrer">Google Play</a>
      </div>
    </div>
  </aside>
</main>
