name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  STUBS_VERSION: '0.2.2'
  WIREMOCK_VERSION: '3.0.1'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build application
        run: npm run build -- --configuration production

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download WireMock standalone
        run: |
          curl -fsSL \
            -o wiremock.jar \
            "https://repo1.maven.org/maven2/org/wiremock/wiremock-standalone/${{ env.WIREMOCK_VERSION }}/wiremock-standalone-${{ env.WIREMOCK_VERSION }}.jar"

      - name: Download blitz-pay stubs JAR
        run: |
          curl -fsSL \
            --user "x-access-token:${{ secrets.RELEASE_PUBLISH_TOKEN }}" \
            -o blitz-pay-stubs.jar \
            "https://maven.pkg.github.com/elegant-software/blitz-pay/com/elegant/software/blitzpay/blitz-pay/${{ env.STUBS_VERSION }}/blitz-pay-${{ env.STUBS_VERSION }}-stubs.jar"

      - name: Extract mappings and start WireMock on :8089
        run: |
          mkdir -p stubs-dir
          (cd stubs-dir && jar xf ../blitz-pay-stubs.jar mappings/ 2>/dev/null || true)
          java -jar wiremock.jar \
            --port 8089 \
            --root-dir stubs-dir \
            --no-request-journal \
            &>/tmp/wiremock.log &

      - name: Wait for WireMock to be ready
        run: |
          echo "Waiting for WireMock on :8089..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8089/__admin/health && echo "WireMock is ready" && exit 0
            sleep 0.5
          done
          echo "WireMock did not start in time — logs:" && cat /tmp/wiremock.log && exit 1

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm run test:contract
