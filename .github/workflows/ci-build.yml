name: CI · Build & Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  STUBS_VERSION: '0.2.2'
  WIREMOCK_VERSION: '3.0.1'

jobs:
  # Builds and tests only run when code or build config changed. The workflow itself
  # always runs, so cd-release.yml still finds a successful run for every release commit.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'projects/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'angular.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci-build.yml'

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      # Same report as the backend pipeline (elegant-ci-cd-pipeline/backend-gradle-test.yml).
      - name: Summarize unit test results
        if: always()
        shell: python3 {0}
        run: |
          import glob, os, xml.etree.ElementTree as ET

          files = sorted(glob.glob("test-results/unit/TEST-*.xml"))
          total = failures = errors = skipped = 0
          failed_tests = []

          for path in files:
            for suite in ET.parse(path).getroot().iter("testsuite"):
              total    += int(suite.get("tests",    0))
              failures += int(suite.get("failures", 0))
              errors   += int(suite.get("errors",   0))
              skipped  += int(suite.get("skipped",  0))
              for tc in suite.findall("testcase"):
                for child in tc:
                  if child.tag in ("failure", "error"):
                    cls  = tc.get("classname", "")
                    name = tc.get("name", "")
                    msg  = (child.get("message") or child.text or "").split("\n")[0][:150]
                    msg  = msg.replace("|", "\\|")
                    failed_tests.append((f"{cls}.{name}" if cls else name, msg))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
            f.write("## Unit Test Results\n\n")
            if not files:
              f.write("No unit test result files were found.\n")
            else:
              fail_icon = " ❌" if (failures + errors) else ""
              f.write("| Metric | Value |\n")
              f.write("|--------|-------|\n")
              f.write(f"| Tests | {total} |\n")
              f.write(f"| Failures{fail_icon} | {failures} |\n")
              f.write(f"| Errors{fail_icon} | {errors} |\n")
              f.write(f"| Skipped | {skipped} |\n")
              if failed_tests:
                f.write("\n### ❌ Failing Unit Tests\n\n")
                f.write("| Test | Reason |\n")
                f.write("|------|--------|\n")
                for test_name, msg in failed_tests:
                  f.write(f"| `{test_name}` | {msg} |\n")

      - name: Upload unit test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          if-no-files-found: ignore
          path: test-results/unit/**

      - name: Publish unit test report
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('test-results/unit/TEST-*.xml') != ''
        with:
          name: Unit Tests
          path: test-results/unit/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Fail if unit tests failed
        if: steps.unit_tests.outcome != 'success'
        run: exit 1

      - name: Build application
        run: npm run build -- --configuration staging

  contract-tests:
    name: Contract Tests
    if: false # Temporarily disable until we have contract tests set up and passing
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download WireMock standalone
        run: |
          curl -fsSL \
            -o wiremock.jar \
            "https://repo1.maven.org/maven2/org/wiremock/wiremock-standalone/${{ env.WIREMOCK_VERSION }}/wiremock-standalone-${{ env.WIREMOCK_VERSION }}.jar"

      - name: Download blitz-pay stubs JAR
        run: |
          curl -fsSL \
            --user "x-access-token:${{ secrets.PACKAGE_READ_TOKEN }}" \
            -o blitz-pay-stubs.jar \
            "https://maven.pkg.github.com/elegant-software/blitz-pay/com/elegant/software/blitzpay/blitz-pay/${{ env.STUBS_VERSION }}/blitz-pay-${{ env.STUBS_VERSION }}-stubs.jar"

      - name: Extract mappings and start WireMock on :8088
        run: |
          echo "=== stubs JAR contents ==="
          jar tf blitz-pay-stubs.jar | head -40

          mkdir -p stubs-dir
          # Extract the full JAR; mappings/ may be nested differently than expected
          (cd stubs-dir && jar xf ../blitz-pay-stubs.jar)

          echo "=== extracted structure ==="
          find stubs-dir -type f | head -30

          # WireMock needs mappings/ directly under --root-dir.
          # If Spring Cloud Contract nested them (e.g. under a sub-directory),
          # hoist them up so WireMock picks them up.
          FOUND=$(find stubs-dir -type d -name mappings | head -1)
          if [ -n "$FOUND" ] && [ "$FOUND" != "stubs-dir/mappings" ]; then
            echo "Hoisting mappings from $FOUND to stubs-dir/mappings"
            mv "$FOUND" stubs-dir/mappings
          fi

          echo "=== mappings to be served ==="
          ls stubs-dir/mappings/ 2>/dev/null || echo "WARNING: no mappings found"

          echo "=== stub URL patterns (to align consumer test IDs) ==="
          find stubs-dir/mappings -name "*.json" | sort | while read f; do
            echo "--- $f ---"
            jq -r '.request | "  method: \(.method // "?")  url: \(.url // .urlPattern // .urlPath // .urlPathPattern // "?")"' "$f"
          done

          java -jar wiremock.jar \
            --port 8088 \
            --root-dir stubs-dir \
            --no-request-journal \
            &>/tmp/wiremock.log &

      - name: Wait for WireMock to be ready
        run: |
          echo "Waiting for WireMock on :8088..."
          for i in $(seq 1 20); do
            curl -sf http://localhost:8088/__admin/health && echo "WireMock is ready" && exit 0
            sleep 0.5
          done
          echo "WireMock did not start in time — logs:" && cat /tmp/wiremock.log && exit 1

      - name: Start CORS proxy on :8089
        # ChromeHeadless enforces CORS: requests from localhost:9876 (Karma) to
        # localhost:8089 (WireMock) are cross-origin. WireMock doesn't add CORS
        # headers, so the browser silently drops all responses (0 Unknown Error).
        # This Node.js proxy sits on :8089, forwards to WireMock on :8088, and
        # injects Access-Control-Allow-Origin on every response.
        run: |
          cat > /tmp/cors-proxy.js << 'EOF'
          const http = require('http');
          const CORS = {
            'Access-Control-Allow-Origin': '*',
            'Access-Control-Allow-Methods': 'GET,POST,PUT,DELETE,PATCH,OPTIONS',
            'Access-Control-Allow-Headers': 'Content-Type,Authorization,Accept',
          };
          http.createServer((req, res) => {
            Object.entries(CORS).forEach(([k, v]) => res.setHeader(k, v));
            if (req.method === 'OPTIONS') { res.writeHead(204); res.end(); return; }
            const fwd = http.request(
              { hostname: 'localhost', port: 8088, path: req.url, method: req.method, headers: req.headers },
              (pr) => { res.writeHead(pr.statusCode, { ...pr.headers, ...CORS }); pr.pipe(res); }
            );
            fwd.on('error', () => { res.writeHead(502); res.end(); });
            req.pipe(fwd);
          }).listen(8089, () => process.stdout.write('CORS proxy listening on :8089\n'));
          EOF
          node /tmp/cors-proxy.js &
          sleep 1
          curl -sf http://localhost:8089/__admin/health && echo "CORS proxy ready"

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm run test:contract
