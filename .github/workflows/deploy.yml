name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (e.g. v0.9.2)
        required: true
      image_repository:
        description: Image repository (defaults to ghcr.io/<this repo>)
        required: false
      kube_namespace:
        description: Kubernetes namespace
        required: true
        default: blitzpay-staging
      manifests_dir:
        description: Path to directory containing deployment.yaml and ingress.yaml
        required: false
        default: k8s
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
      image_repository:
        type: string
        required: false
      kube_namespace:
        type: string
        required: false
        default: blitzpay-staging
      manifests_dir:
        type: string
        required: false
        default: k8s
    secrets:
      K8S_SERVER:
        required: true
      K8S_CA_CERT:
        required: true
      K8S_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: self-hosted
    env:
      KUBE_NAMESPACE: ${{ inputs.kube_namespace || github.event.inputs.kube_namespace }}
      IMAGE_REFERENCE: ${{ format('{0}:{1}', inputs.image_repository || format('ghcr.io/{0}', github.repository), inputs.image_tag) }}
      MANIFESTS_DIR: ${{ inputs.manifests_dir || github.event.inputs.manifests_dir || 'k8s' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify deployment manifests exist
        run: |
          if [ ! -f "${MANIFESTS_DIR}/deployment.yaml" ]; then
            echo "::error file=${MANIFESTS_DIR}/deployment.yaml::Missing Kubernetes deployment manifest"
            exit 1
          fi

      - name: Configure kubectl
        env:
          K8S_SERVER: ${{ secrets.K8S_SERVER }}
          K8S_CA_CERT: ${{ secrets.K8S_CA_CERT }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$K8S_CA_CERT" | base64 -d > "$HOME/.kube/ca.crt"

          kubectl config set-cluster deploy-cluster \
            --server="$K8S_SERVER" \
            --certificate-authority="$HOME/.kube/ca.crt" \
            --tls-server-name=kubernetes \
            --embed-certs=true

          kubectl config set-credentials deploy-user \
            --token="$K8S_TOKEN"

          kubectl config set-context deploy-context \
            --cluster=deploy-cluster \
            --user=deploy-user

          kubectl config use-context deploy-context

      - name: Verify cluster connectivity
        run: kubectl cluster-info --request-timeout=10s

      - name: Render Kubernetes manifests
        run: |
          sed "s|\${IMAGE}|${IMAGE_REFERENCE}|g" "${MANIFESTS_DIR}/deployment.yaml" > /tmp/deployment.yaml
          cp "${MANIFESTS_DIR}/ingress.yaml" /tmp/ingress.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f /tmp/deployment.yaml -n "$KUBE_NAMESPACE"
          kubectl apply -f /tmp/ingress.yaml -n "$KUBE_NAMESPACE"
