name: Deploy frontend

on:
  workflow_dispatch:
    inputs:
      image_reference:
        description: Frontend image reference
        required: true
      kube_namespace:
        description: Kubernetes namespace
        required: true
        default: blitzpay-staging
  workflow_call:
    inputs:
      image_reference:
        type: string
        required: true
      kube_namespace:
        type: string
        required: false
        default: blitzpay-staging
    secrets:
      K8S_SERVER:
        required: true
      K8S_CA_CERT:
        required: true
      K8S_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  apply:
    runs-on: self-hosted
    env:
      KUBE_NAMESPACE: ${{ inputs.kube_namespace || github.event.inputs.kube_namespace }}
      IMAGE_REFERENCE: ${{ inputs.image_reference || github.event.inputs.image_reference }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify deployment manifests exist
        run: |
          if [ ! -f k8s/deployment.yaml ]; then
            echo "::error file=k8s/deployment.yaml::Missing Kubernetes deployment manifest"
            exit 1
          fi

      - name: Configure kubectl
        env:
          K8S_SERVER: ${{ secrets.K8S_SERVER }}
          K8S_CA_CERT: ${{ secrets.K8S_CA_CERT }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$K8S_CA_CERT" | base64 -d > "$HOME/.kube/ca.crt"

          kubectl config set-cluster deploy-cluster \
            --server="$K8S_SERVER" \
            --certificate-authority="$HOME/.kube/ca.crt" \
            --embed-certs=true

          kubectl config set-credentials deploy-user \
            --token="$K8S_TOKEN"

          kubectl config set-context deploy-context \
            --cluster=deploy-cluster \
            --user=deploy-user

          kubectl config use-context deploy-context

      - name: Verify cluster connectivity
        run: kubectl cluster-info --request-timeout=10s

      - name: Render Kubernetes manifests
        run: |
          sed "s|\${IMAGE}|${IMAGE_REFERENCE}|g" k8s/deployment.yaml > /tmp/deployment.yaml
          cp k8s/ingress.yaml /tmp/ingress.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f /tmp/deployment.yaml -n "$KUBE_NAMESPACE"
          kubectl apply -f /tmp/ingress.yaml -n "$KUBE_NAMESPACE"
