# Runs automatically when a GitHub Release is published (normally via "Release · Create Release").
# Checks CI passed for the tagged commit, builds both images with the release tag, and deploys both to staging.
name: CD · Release Build & Deploy Staging
run-name: Release ${{ github.event.release.tag_name || github.ref_name }} → staging

on:
  release:
    types:
      - released
      - prereleased

permissions:
  actions: read
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  IMAGE_REPOSITORY: ${{ format('ghcr.io/{0}', github.repository) }}

jobs:
  verify-release-ci:
    name: Verify CI passed for ${{ github.event.release.tag_name || github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.release.tag_name || github.ref_name }}

      - name: Resolve release commit SHA
        id: resolve-release-sha
        run: echo "release_sha=$(git rev-list -n 1 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure push CI succeeded for release commit
        uses: actions/github-script@v9
        env:
          RELEASE_SHA: ${{ steps.resolve-release-sha.outputs.release_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseSha = process.env.RELEASE_SHA;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'ci-build.yml',
                status: 'completed',
                per_page: 100
              }
            );

            const successfulRun = runs.find((run) => run.head_sha === releaseSha && run.conclusion === 'success');
            if (!successfulRun) {
              core.setFailed(`No successful CI run found for release commit ${releaseSha}. Publish the release only after CI succeeds for that commit.`);
              return;
            }

            core.info(`Matched successful CI run #${successfulRun.run_number} for ${releaseSha}.`);

  build-release-image:
    name: Build admin image ${{ github.event.release.tag_name || github.ref_name }}
    needs: verify-release-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build application
        run: npm run build -- --configuration staging

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: compute-image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          echo "IMAGE_REFERENCE=${IMAGE_REPOSITORY}:${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "image_reference=${IMAGE_REPOSITORY}:${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_REFERENCE }}
          build-args: BUILD_CONFIGURATION=staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add image to job summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### 🐳 Built admin image"
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${IMAGE_REFERENCE}\` | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Image pushed::${IMAGE_REFERENCE}"

  build-storefront-image:
    name: Build storefront image ${{ github.event.release.tag_name || github.ref_name }}
    needs: verify-release-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run storefront tests
        run: npm run test:storefront -- --watch=false --browsers=ChromeHeadless

      - name: Build storefront
        run: npm run build:storefront -- --configuration production

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: compute-image
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          echo "image_reference=${IMAGE_REPOSITORY}/blitz-pay-web:${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push storefront image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.storefront
          push: true
          tags: ${{ steps.compute-image.outputs.image_reference }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Add image to job summary
        env:
          IMAGE_REFERENCE: ${{ steps.compute-image.outputs.image_reference }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### 🐳 Built storefront image"
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`${IMAGE_REFERENCE}\` | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Image pushed::${IMAGE_REFERENCE}"

  deploy-staging:
    name: Admin → Staging
    needs: build-release-image
    uses: ./.github/workflows/cd-deploy-k8s.yml
    with:
      app: admin
      image_tag: ${{ github.event.release.tag_name || github.ref_name }}
      kube_namespace: blitzpay-staging
    secrets:
      K8S_SERVER: ${{ secrets.K8S_SERVER }}
      K8S_CA_CERT: ${{ secrets.K8S_CA_CERT }}
      K8S_TOKEN: ${{ secrets.K8S_TOKEN }}

  deploy-storefront-staging:
    name: Storefront → Staging
    needs: build-storefront-image
    uses: ./.github/workflows/cd-deploy-k8s.yml
    with:
      app: storefront
      image_tag: ${{ github.event.release.tag_name || github.ref_name }}
      kube_namespace: blitzpay-staging
    secrets:
      K8S_SERVER: ${{ secrets.K8S_SERVER }}
      K8S_CA_CERT: ${{ secrets.K8S_CA_CERT }}
      K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
